
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
        color: white;
        text-align: center;
    }

    .container {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 600px;
        padding: 25px;
    }

    /* Top Heart */
    .heart {
        font-size: 60px;
        animation: heartbeat 1.2s infinite;
    }

    /* Photo */
    .love-photo {
        width: 230px;
        height: 230px;
        object-fit: cover;
        border-radius: 50%;
        border: 7px solid white;
        box-shadow:
            0 0 20px rgba(255,255,255,.8),
            0 10px 35px rgba(0,0,0,.3);
        margin: 10px auto 20px;
        display: block;
        animation: photoAppear 2s ease;
    }

    h1 {
        font-size: 45px;
        margin: 10px 0;
        text-shadow: 0 4px 15px rgba(0,0,0,.3);
        animation: fadeIn 2s ease;
    }

    p {
        font-size: 21px;
        line-height: 1.6;
        margin: 15px 0;
        animation: fadeIn 2.5s ease;
    }

    .forever {
        font-size: 26px;
        font-weight: bold;
        margin-top: 15px;
        animation: fadeIn 3s ease;
    }

    /* Button */
    .love-button {
        margin-top: 25px;
        padding: 15px 32px;
        border: none;
        border-radius: 30px;
        background: white;
        color: #ff4f81;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(0,0,0,.25);
        transition: .3s;
        animation: fadeIn 3.5s ease;
    }

    .love-button:hover {
        transform: scale(1.1);
    }

    /* Floating Hearts */
    .floating-heart {
        position: absolute;
        bottom: -50px;
        font-size: 25px;
        animation: float 8s linear infinite;
        opacity: .8;
        pointer-events: none;
    }

    /* Heartbeat */
    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.25);
        }
    }

    /* Photo Animation */
    @keyframes photoAppear {
        from {
            opacity: 0;
            transform: scale(.5);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Fade */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Floating Animation */
    @keyframes float {
        from {
            transform: translateY(0) rotate(0deg);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        to {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    /* Mobile */
    @media (max-width: 600px) {

        .heart {
            font-size: 45px;
        }

        .love-photo {
            width: 180px;
            height: 180px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            font-size: 17px;
        }

        .forever {
            font-size: 20px;
        }

        .love-button {
            font-size: 16px;
            padding: 13px 27px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <!-- Heart -->
    <div class="heart">❤️</div>

    <!-- Your Photo -->
    <img
        src="love.jpeg"
        alt="My Love"
        class="love-photo"
    >

    <!-- Main Message -->
    <h1>I Love You Forever ❤️</h1>

    <p>
        No matter where life takes us,<br>
        my heart will always choose you. ❤️
    </p>

    <div class="forever">
        You & Me — Forever & Always 💕
    </div>

    <!-- Button -->
    <button class="love-button" onclick="showLove()">
        Click Me ❤️
    </button>

</div>


<script>

function showLove() {

    alert(
        "I LOVE YOU FOREVER ❤️🥰\n\n" +
        "You are my favorite person in this world. 💕\n\n" +
        "Forever starts with you. ❤️"
    );

}


/* Floating Hearts */

const hearts = [
    "❤️",
    "💕",
    "💖",
    "💗",
    "💘",
    "💝",
    "🥰"
];

for (let i = 0; i < 30; i++) {

    const heart = document.createElement("div");

    heart.className = "floating-heart";

    heart.innerHTML =
        hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.animationDuration =
        (5 + Math.random() * 6) + "s";

    heart.style.animationDelay =
        Math.random() * 8 + "s";

    heart.style.fontSize =
        (18 + Math.random() * 20) + "px";

    document.body.appendChild(heart);
}

</script>

</body>
</html>
